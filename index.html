<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - أحمد وندى</title>
    <link rel="stylesheet" href="style.css">
    <!-- خطوط جوجل عربية ولاتينية مميزة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <!-- زينة الزوايا والأعمدة الخلفية -->
        <div class="decorations">
            <div class="lights"></div>
            <div class="arch-bg"></div>
        </div>

        <!-- صورة العروسين -->
        <div class="couple-image-container">
            <!-- ضع صورة العروسين هنا -->
            <img src="couple.png" alt="Ahmed & Nada" class="couple-img">
        </div>

        <!-- النصوص والمعلومات التي تظهر بالحركة -->
        <div class="content">
            <p class="subtitle fade-in">TOGETHER WITH THEIR FAMILIES</p>
            <p class="tagline fade-in delay-1">WE INVITE YOU TO CELEBRATE THE WEDDING OF</p>
            
            <h1 class="names fade-in delay-2">AHMED & NADA</h1>
            <div class="divider fade-in delay-2">✦</div>

            <div class="date-container fade-in delay-3">
                <span class="day">FRIDAY</span>
                <div class="date-box">
                    <span class="day-num">22</span>
                    <span class="month-year">OCT 2026</span>
                </div>
                <span class="day">FRIDAY</span>
            </div>

            <div class="location fade-in delay-4">
                <p class="venue">Dar El Madfaeya</p>
                <p class="hall">Al Maleka Hall</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
